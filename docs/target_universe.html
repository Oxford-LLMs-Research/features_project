<!DOCTYPE html>
<html lang="en">
<head>

  <title>Target universe</title>
  <style>
    :root {
      --bg: #f6f6f4;
      --surface: #fff;
      --text: #1a1a1a;
      --muted: #5c5c5c;
      --line: #e2e2dc;
      --accent: #2563eb;
      --warn: #b45309;
      --bar: #3b82f6;
      --bar2: #64748b;
      --warn-bar: #d97706;
      --c3: #0f766e;
      --c4: #7c3aed;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121212;
        --surface: #1c1c1c;
        --text: #ededed;
        --muted: #a3a3a3;
        --line: #2e2e2e;
        --accent: #60a5fa;
        --warn: #fbbf24;
        --bar: #60a5fa;
        --bar2: #94a3b8;
        --warn-bar: #f59e0b;
        --c3: #2dd4bf;
        --c4: #c4b5fd;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 15px/1.45 system-ui, -apple-system, Segoe UI, sans-serif;
      color: var(--text);
      background: var(--bg);
    }
    .wrap { max-width: 1040px; margin: 0 auto; padding: 28px 20px 64px; }
    h1 { font-size: 24px; font-weight: 650; margin: 0 0 8px; }
    h2 { font-size: 18px; font-weight: 650; margin: 0 0 6px; }
    h3 { font-size: 15px; font-weight: 650; margin: 0 0 6px; }
    p { margin: 0; }
    .muted { color: var(--muted); }
    .small { font-size: 13px; }
    .stack { display: flex; flex-direction: column; gap: 24px; }
    .gap8 { gap: 8px; }
    .gap16 { gap: 16px; }
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 800px) {
      .stats, .two { grid-template-columns: 1fr; }
    }
    .stat {
      background: var(--surface);
      border: 1px solid var(--line);
      padding: 14px 16px;
    }
    .stat .v { font-size: 22px; font-weight: 650; letter-spacing: -0.02em; }
    .stat .l { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .tone-warn .v { color: var(--warn); }
    .callout {
      border: 1px solid var(--line);
      border-left: 3px solid var(--accent);
      padding: 12px 14px;
      background: var(--surface);
    }
    .callout.warn { border-left-color: var(--warn); }
    .callout h3 { margin-bottom: 4px; }
    label.toggle {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      justify-content: space-between;
      cursor: pointer;
      background: var(--surface);
      border: 1px solid var(--line);
      padding: 12px 14px;
    }
    label.toggle input { margin-top: 4px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: 550; }
    tr.warn td { color: var(--warn); }
    .chart { width: 100%; height: 200px; }
    .chart.tall { height: 240px; }
    .chart.topics { height: 420px; }
    .legend { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 10px 14px; margin-bottom: 6px; }
    .swatch { width: 10px; height: 10px; display: inline-block; margin-right: 6px; vertical-align: middle; }
    hr { border: 0; border-top: 1px solid var(--line); margin: 0; }
  </style>
</head>

  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function barChart(cats, series, opts) {
  opts = opts || {};
  const stacked = !!opts.stacked;
  const w = 640, h = opts.height || 200, padL = 28, padR = 12, padT = 18, padB = 36;
  const innerW = w - padL - padR, innerH = h - padT - padB;
  const n = cats.length, g = series.length;
  const totals = cats.map((_, i) => series.reduce((a, s) => a + s.data[i], 0));
  const max = Math.max(1, ...(stacked ? totals : series.flatMap((s) => s.data)));
  const groupW = innerW / n;
  const barW = stacked ? Math.min(36, groupW * 0.55) : Math.min(28, (groupW * 0.72) / g);
  let bars = "";
  cats.forEach((_, i) => {
    if (stacked) {
      let y = padT + innerH;
      series.forEach((s) => {
        const bh = (s.data[i] / max) * innerH;
        y -= bh;
        bars += `<rect x="${padL + i * groupW + (groupW - barW) / 2}" y="${y}" width="${barW}" height="${Math.max(0, bh)}" fill="${s.color}" />`;
      });
      if (opts.showValues && totals[i]) {
        bars += `<text x="${padL + i * groupW + groupW / 2}" y="${y - 4}" text-anchor="middle" font-size="10" fill="currentColor">${totals[i]}</text>`;
      }
    } else {
      series.forEach((s, si) => {
        const v = s.data[i];
        const bh = (v / max) * innerH;
        const x = padL + i * groupW + (groupW - barW * g) / 2 + si * barW;
        const y = padT + innerH - bh;
        bars += `<rect x="${x}" y="${y}" width="${barW}" height="${Math.max(0, bh)}" fill="${s.color || "var(--bar)"}" />`;
        if (opts.showValues && v) {
          bars += `<text x="${x + barW / 2}" y="${y - 4}" text-anchor="middle" font-size="10" fill="currentColor">${v}</text>`;
        }
      });
    }
  });
  const labels = cats.map((c, i) =>
    `<text x="${padL + i * groupW + groupW / 2}" y="${h - 10}" text-anchor="middle" font-size="11" fill="var(--muted)">${esc(c)}</text>`
  ).join("");
  const legend = series.length > 1
    ? `<div class="legend">${series.map((s) => `<span><span class="swatch" style="background:${s.color}"></span>${esc(s.name)}</span>`).join("")}</div>`
    : "";
  return `${legend}<svg class="chart${opts.tall ? " tall" : ""}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">${bars}${labels}</svg>`;
}

function hBarChart(cats, data) {
  const w = 640, rowH = 20, padL = 168, padR = 40, padT = 8, padB = 8;
  const h = padT + padB + cats.length * rowH;
  const innerW = w - padL - padR;
  const max = Math.max(1, ...data);
  let bars = "";
  cats.forEach((c, i) => {
    const y = padT + i * rowH;
    const bw = (data[i] / max) * innerW;
    bars += `<text x="${padL - 8}" y="${y + 13}" text-anchor="end" font-size="11" fill="var(--muted)">${esc(c)}</text>`;
    bars += `<rect x="${padL}" y="${y + 3}" width="${bw}" height="12" fill="var(--bar)" />`;
    bars += `<text x="${padL + bw + 6}" y="${y + 13}" font-size="11" fill="currentColor">${data[i]}</text>`;
  });
  return `<svg class="chart topics" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">${bars}</svg>`;
}

function donut(items) {
  const cx = 120, cy = 120, r = 78, ir = 46;
  const total = items.reduce((a, x) => a + x.n, 0) || 1;
  let a0 = -Math.PI / 2, d = "";
  items.forEach((it, i) => {
    const a1 = a0 + (it.n / total) * Math.PI * 2;
    const large = a1 - a0 > Math.PI ? 1 : 0;
    const x0 = cx + r * Math.cos(a0), y0 = cy + r * Math.sin(a0);
    const x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
    const xi0 = cx + ir * Math.cos(a0), yi0 = cy + ir * Math.sin(a0);
    const xi1 = cx + ir * Math.cos(a1), yi1 = cy + ir * Math.sin(a1);
    d += `<path d="M ${x0} ${y0} A ${r} ${r} 0 ${large} 1 ${x1} ${y1} L ${xi1} ${yi1} A ${ir} ${ir} 0 ${large} 0 ${xi0} ${yi0} Z" fill="${it.color}" />`;
    a0 = a1;
  });
  return `<svg width="240" height="240" viewBox="0 0 240 240">${d}</svg>`;
}

function emptyTypes() { return { binary: 0, ordinal: 0, nominal: 0, continuous: 0 }; }
function emptySecs() {
  const o = {};
  SECTIONS.forEach((s) => { o[s] = 0; });
  return o;
}

function render() {
  const { includeDemo, includeSkip } = state;
  const vis = ROWS.filter((r) => {
    if (r.n1 < 1) return false;
    if (!includeDemo && r.sec === "demographics") return false;
    if (!includeSkip && r.skip) return false;
    return true;
  });
  const typeSum = emptyTypes();
  const bySurveyType = {};
  const bySurveySec = {};
  SURVEYS.forEach((s) => { bySurveyType[s.id] = emptyTypes(); bySurveySec[s.id] = emptySecs(); });
  const tags = {};
  let cells = 0, cellsFailKept = 0;
  vis.forEach((r) => {
    const t = TYPE_FROM[r.t];
    typeSum[t] += 1;
    bySurveyType[r.s][t] += 1;
    bySurveySec[r.s][r.sec] += 1;
    cells += r.n1;
    cellsFailKept += r.nf;
    if (r.sec !== "demographics" && r.tag) tags[r.tag] = (tags[r.tag] || 0) + 1;
  });
  const total = vis.length;
  const bySurvey = SURVEYS.map((s) => TYPES.reduce((n, t) => n + bySurveyType[s.id][t], 0));
  const shownSecs = includeDemo ? SECTIONS : SECTIONS.filter((x) => x !== "demographics");
  const secRows = shownSecs.map((section) => ({
    section,
    n: SURVEYS.reduce((acc, s) => acc + bySurveySec[s.id][section], 0),
  }));
  const secTotal = secRows.reduce((a, r) => a + r.n, 0) || 1;
  const topicRows = Object.entries(tags).sort((a, b) => b[1] - a[1]).slice(0, 20);
  const afterType1 = FUNNEL.kept - FUNNEL.type1Zero;
  const funnelData = [FUNNEL.codebook, FUNNEL.codebook - FUNNEL.excluded, FUNNEL.kept, afterType1, total];

  const typeTable = SURVEYS.map((s) => {
    const t = bySurveyType[s.id];
    const tot = t.binary + t.ordinal + t.nominal + t.continuous;
    const cellsS = vis.filter((r) => r.s === s.id).reduce((a, r) => a + r.n1, 0);
    return `<tr><td>${s.label}</td><td>${t.binary}</td><td>${t.ordinal}</td><td>${t.nominal}</td><td>${t.continuous}</td><td>${tot}</td><td>${cellsS.toLocaleString()}</td></tr>`;
  }).join("");

  const secTable = secRows.map((r) =>
    `<tr class="${r.section === "demographics" ? "warn" : ""}"><td>${SECTION_LABEL[r.section]}</td><td>${r.n}</td><td>${((100 * r.n) / secTotal).toFixed(1)}%</td></tr>`
  ).join("");

  const secBySurvey = SURVEYS.map((s) =>
    `<tr><td>${s.label}</td>${secRows.map((r) => `<td>${bySurveySec[s.id][r.section] || 0}</td>`).join("")}</tr>`
  ).join("");

  const topics = (!includeDemo && topicRows.length)
    ? `<div class="stack gap8"><h2>Topic tags (non-demographics)</h2>
       ${hBarChart(topicRows.map((t) => t[0]), topicRows.map((t) => t[1]))}
       <p class="small muted">Top 20 topic_tag values among the current non-demographic candidates.</p></div>`
    : "";

  document.getElementById("app").innerHTML = `
    <div class="stack gap8">
      <h1>Target universe</h1>
      <p class="muted">Standalone copy of the Cursor canvas, 16 Aug 2026. Step 1 of the main-run grid. Type-1 cells are dropped before sampling: classification needs two classes with n ≥ 50 in the country (so V2 has ~10 minority rows); ordinal/continuous need n ≥ 50 and ≥3 scale points. Skip/follow-up items are off by default. ESS wave 10 omitted. Open this file in a browser. No network required.</p>
    </div>
    <div class="callout">
      <h3>Type-1 is a cross-tab, not an oracle</h3>
      <p class="small">177 of 2,109 items have no country with enough minority support; they never enter the sampling pool. The other 1,932 still have dead countries: 17,485 of 59,358 item×country cells fail the same floor. Sampling draws only from passing cells (41,873 before the toggles below), not from a target and then a random country.</p>
    </div>
    <label class="toggle">
      <span><strong>Include demographics section</strong><br><span class="small muted">430 type-1-viable items. Not a lock. WVS Q263 (immigrant) lives here: 21 of 66 countries pass type-1; the rest are too thin. It is not a skip item.</span></span>
      <input type="checkbox" data-act="demo" ${includeDemo ? "checked" : ""} />
    </label>
    <label class="toggle">
      <span><strong>Include skip / follow-up items</strong><br><span class="small muted">Off by default. 368 routed follow-ups (median structural NA ≥ 0.25 in countries where the item was fielded) plus 105 gates whose classes split that missingness (Afro Q67A climate filter; ESS rtrd). Country-not-fielded modules are not in this set.</span></span>
      <input type="checkbox" data-act="skip" ${includeSkip ? "checked" : ""} />
    </label>
    <div class="stats">
      <div class="stat"><div class="v">${total.toLocaleString()}</div><div class="l">Candidate targets</div></div>
      <div class="stat"><div class="v">${cells.toLocaleString()}</div><div class="l">Viable cells</div></div>
      <div class="stat"><div class="v">${typeSum.ordinal}</div><div class="l">Ordinal</div></div>
      <div class="stat tone-warn"><div class="v">${FUNNEL.type1Zero}</div><div class="l">Targets with 0 viable countries</div></div>
    </div>
    <div class="stats">
      <div class="stat"><div class="v">${typeSum.binary}</div><div class="l">Binary</div></div>
      <div class="stat"><div class="v">${typeSum.nominal}</div><div class="l">Nominal</div></div>
      <div class="stat"><div class="v">${typeSum.continuous}</div><div class="l">Continuous</div></div>
      <div class="stat tone-warn"><div class="v">${cellsFailKept.toLocaleString()}</div><div class="l">Dead cells of these targets</div></div>
    </div>
    <div class="stack gap8">
      <h2>Nomination funnel</h2>
      ${barChart(["Codebook", "Admin drop", "Single-cat drop", "Type-1 targets", "This filter"], [{ name: "Variables", data: funnelData, color: "var(--bar)" }], { showValues: true })}
      <p class="small muted">2,166 codebook entries, then 54 admin/country and 3 single-category drops, then 177 with no type-1 country. Last bar applies the toggles (demographics ${includeDemo ? "on" : "off"}, skip/follow-up ${includeSkip ? "on" : "off"}). Source: pulled_metadata plus respondent files; skip uses fielded-country structural NA.</p>
    </div>
    <hr />
    <div class="stack gap8">
      <h2>Count by survey</h2>
      ${barChart(SURVEYS.map((s) => s.label), [{ name: "Candidates", data: bySurvey, color: "var(--bar)" }], { showValues: true })}
      <p class="small muted">Targets with at least one type-1 country after the current toggles. Viable cells are the country slices that actually pass, not targets times all countries.</p>
    </div>
    <div class="stack gap8">
      <h3>Measurement type by survey</h3>
      ${barChart(SURVEYS.map((s) => s.label), TYPES.map((t) => ({ name: t, data: SURVEYS.map((s) => bySurveyType[s.id][t]), color: TYPE_COLORS[t] })), { stacked: true, tall: true, showValues: true, height: 220 })}
      <p class="small muted">Stacked count. detect_target_type on labels and the data column. Type-1 uses the same measurement level as the oracle (log-loss class counts vs Spearman scale points).</p>
    </div>
    <table>
      <thead><tr><th>Survey</th><th>Binary</th><th>Ordinal</th><th>Nominal</th><th>Continuous</th><th>Targets</th><th>Viable cells</th></tr></thead>
      <tbody>${typeTable}</tbody>
    </table>
    <hr />
    <div class="stack gap8">
      <h2>Theme share (codebook section)</h2>
      <div class="two">
        <div class="stack gap8" style="align-items:center">
          ${donut(secRows.map((r, i) => ({ n: r.n, color: r.section === "demographics" ? "var(--warn)" : SEC_COLORS[i] })))}
          <p class="small muted">Share of ${secTotal.toLocaleString()} candidates${includeDemo ? "" : ", demographics omitted"}.</p>
        </div>
        <table>
          <thead><tr><th>Section</th><th>n</th><th>Share</th></tr></thead>
          <tbody>${secTable}</tbody>
        </table>
      </div>
    </div>
    <table>
      <thead><tr><th>Survey</th>${secRows.map((r) => `<th>${SECTION_LABEL[r.section]}</th>`).join("")}</tr></thead>
      <tbody>${secBySurvey}</tbody>
    </table>
    ${topics}
    <div class="callout warn">
      <h3>Concentrated leakage is still later</h3>
      <p class="small">Skip/follow-up is routing: not asked unless a filter question fired. WVS Q263 (immigrant) and Q266 (country of birth) are asked of almost everyone, so they are not on that toggle. Q263 already fails type-1 in 45 of 66 countries; the remaining 21 are the leakage cells the oracle audit caught. ESS mnactic (main activity) is the leak for rtrd, which is on the skip toggle as a gate. Accuracy-vs-majority (old type 2/3) is not used here.</p>
    </div>
  `;
}

document.getElementById("app").addEventListener("change", (e) => {
  const t = e.target.closest("[data-act]");
  if (!t) return;
  if (t.getAttribute("data-act") === "demo") state.includeDemo = t.checked;
  else if (t.getAttribute("data-act") === "skip") state.includeSkip = t.checked;
  else return;
  render();
});
render();
  </script>
</body>
</html>
