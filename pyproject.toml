[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "survey-features"
version = "0.1.0"
description = "LLM feature-selection capability study: free-text elicitation, mapping, and oracle evaluation across surveys and countries. Pipeline package only — paper/writeup artifacts live outside the installable tree."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "openai>=1.0",
    "synthetic_sampling @ git+https://github.com/Oxford-LLMs-Research/synthetic_sampling.git@19b5566083008ef5aff38a7b31654d1421fa6a73",
    "sentence-transformers",
    # 2.0.x breaks on scikit-learn 1.6+ via missing __sklearn_tags__
    "xgboost>=2.1.4",
    "scikit-learn",
    "pandas",
    "numpy",
    "matplotlib",
    "scipy",
    "python-dotenv",
    "pyaml",
    "joblib",
]

[project.optional-dependencies]
# The AutoGluon oracle (survey_features.oracle) is heavy; only needed to (re)compute
# outputs/cache/cells/*/oracle.csv. Everything else runs against the cached oracle CSVs.
oracle = ["autogluon"]
# Unit tests (pure helpers; no API / survey data required).
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
